---

- name: Show setup on control node
  delegate_to: localhost
  run_once: true
  vars:
    python_venv: "{{ ansible_playbook_python | regex_replace('/bin/python.*') }}"
  block:

    - name: Get the python interpreter
      ansible.builtin.set_fact:
        ansible_galaxy: "{{ python_venv }}/bin/ansible-galaxy"
        pip3: "{{ python_venv }}/bin/pip3"

    - name: Get ansible collections
      ansible.builtin.command:
        cmd: >-
          {{ ansible_galaxy }} collection list
      changed_when: false
      register: __ansible_galaxy
      environment:
        ANSIBLE_COLLECTIONS_PATH: "{{ lookup('env', 'ANSIBLE_COLLECTIONS_PATH') }}"

    - name: Get python modules
      ansible.builtin.command:
        cmd: >-
          {{ pip3 }} list
      changed_when: false
      register: pip_packages

    - name: Show ansible version
      ansible.builtin.debug:
        msg:
          python_interpreter: "{{ ansible_playbook_python }}"
          python_packages: "{{ pip_packages.stdout_lines }}"
          ansible_version: "{{ ansible_version.full }}"
          ansible_collections: "{{ __ansible_galaxy.stdout_lines[2:] }}"
